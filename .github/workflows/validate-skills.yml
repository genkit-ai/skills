name: Validate Skills & Reference TOCs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Check skills markdown hygiene and TOCs
        run: python3 scripts/sync_tocs.py --check
