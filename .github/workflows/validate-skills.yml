name: Validate Skills & Reference TOCs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Check skills markdown hygiene and TOCs
        run: python3 scripts/sync_tocs.py --check
